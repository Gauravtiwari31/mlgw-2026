# Base + the six count features from the density A/B test (group abcounts_v1, half density).
# A second, genuinely different model so the stacker can be tested before the flow models land.
# Build the group first:
#   python -c "from src.density_ab import count_features; from src.common import load_raw, save_features; save_features(count_features(load_raw(), 'half_s0'), 'abcounts_v1', 'half_s0')"
run_id: L1_lgbm_base1abc1_s0
features: [base_v1, abcounts_v1]
view: half_s0
seed: 0
labels: raw
legit_keep: 0.2
class_weight_power: 0.5
num_boost_round: 1500
early_stopping: 60
params:
  learning_rate: 0.08
  num_leaves: 63
  min_data_in_leaf: 40
