# base + flow_v1, early stopping on class-weighted log loss instead of argmax macro-F1 (L1 trainer test).
run_id: L1_lgbm_base1-flow1_ll_s0
features: [base_v1, flow_v1]
view: half_s0            # density-matched view (audit/density_ab.md)
seed: 0
labels: raw
legit_keep: 0.2
class_weight_power: 0.5
num_boost_round: 1500
early_stopping: 100
early_stop_metric: logloss   # smooth stopping criterion; see src/train.py
params:
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 40
