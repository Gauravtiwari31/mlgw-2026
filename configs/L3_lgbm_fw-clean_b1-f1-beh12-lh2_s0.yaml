# L3 LightGBM A/B on the corrected line: identical to beh123-lh2 s0 minus behaviour_v3
run_id: L3_lgbm_fw-clean_b1-f1-beh12-lh2_s0
features: [base_v1, flow_v1, behaviour_v1, behaviour_v2, labelhist_v2]
