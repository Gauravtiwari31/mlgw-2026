# Half-density twin of L2_lgbm_fw1-clean_b1-f1-beh12_s3.
# Same model on the second fraud-whole view (fw_s1: a different random half of the legit rows).
run_id: L2_lgbm_half1-clean_b1-f1-beh12_s3
features: [base_v1, flow_v1, behaviour_v1, behaviour_v2]
view: half_s1
seed: 3
labels: clean
drop_features: [ip_risk_rank]
legit_keep: 0.2
class_weight_power: 0.5
num_boost_round: 3000
early_stopping: 150
early_stop_metric: logloss
params:
  learning_rate: 0.03
  num_leaves: 31
  min_data_in_leaf: 100
  feature_fraction: 0.5
  lambda_l2: 5.0
