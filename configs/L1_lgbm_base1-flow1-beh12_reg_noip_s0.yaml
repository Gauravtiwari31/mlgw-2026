# Same as L1_lgbm_base1-flow1-beh12_reg_s0 without ip_risk_rank.
# more feature subsampling, slower learning. The ll runs stop after ~55 trees (overfitting).
run_id: L1_lgbm_base1-flow1-beh12_reg_noip_s0
features: [base_v1, flow_v1, behaviour_v1, behaviour_v2]
view: half_s0
seed: 0
labels: raw
drop_features: [ip_risk_rank]   # dead in October (audit/gap_analysis.md section 4)
legit_keep: 0.2
class_weight_power: 0.5
num_boost_round: 3000
early_stopping: 150
early_stop_metric: logloss
params:
  learning_rate: 0.03
  num_leaves: 31
  min_data_in_leaf: 200
  feature_fraction: 0.5
  lambda_l2: 10.0
  min_gain_to_split: 0.0
